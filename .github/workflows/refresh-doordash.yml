name: Refresh DoorDash restaurant list
on:
  schedule: [{cron: '0 9 1 * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-doordash.py --fetch
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/restaurants.json scripts/raw/doordash-jonesboro-store-urls.txt
          git diff --cached --quiet || (git commit -m "Monthly DoorDash list refresh" && git push)
