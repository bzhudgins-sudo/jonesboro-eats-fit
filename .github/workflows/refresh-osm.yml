name: Refresh OSM restaurants
on:
  schedule: [{cron: '0 9 1 * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/refresh-osm.mjs
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/restaurants.json; git diff --cached --quiet || (git commit -m "Monthly OSM refresh" && git push)
